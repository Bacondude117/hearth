name: Release

# Builds the Windows installers and attaches them to a draft GitHub release.
# Either push a tag like v0.1.0, or run this workflow from the Actions tab with a version:
# the tag is then created on the commit the workflow runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (must match the app version)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          app_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $TAG does not match the app version $app_version"
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for details." > notes.md; fi
          {
            echo "body<<EOF_NOTES"
            cat notes.md
            echo
            echo "**Download:** \`Hearth_*_x64-setup.exe\` (recommended) or the \`.msi\`."
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Hearth ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
