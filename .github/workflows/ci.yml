name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p hearth-core
      - name: Cache Tauri bundler tools (NSIS, WiX)
        uses: actions/cache@v4
        with:
          # bundle.useLocalToolsDir in tauri.conf.json keeps the tools here.
          path: target/.tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-tools-${{ runner.os }}-
      - name: Build installer
        # Tauri downloads NSIS/WiX from GitHub on a cold cache, which sometimes times out (504).
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx tauri build && exit 0
            echo "::warning::tauri build failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
