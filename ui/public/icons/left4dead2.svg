<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1414"/><stop offset="1" stop-color="#140808"/></linearGradient>
  </defs>
  <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- blood moon -->
    <circle cx="44" cy="18" r="10" fill="#b8322a"/>
    <circle cx="41" cy="15" r="2" fill="#9a2721"/><circle cx="47" cy="21" r="1.5" fill="#9a2721"/>
    <!-- ruined skyline -->
    <path d="M0 64 V40 h8 v-6 h6 v10 h6 V30 h8 v8 l4 -3 v29 z" fill="#0b0505"/>
    <path d="M30 64 V36 h10 v-4 h6 v8 h8 v-6 h10 v30 z" fill="#0b0505"/>
    <!-- safe-room style hand mark -->
    <g transform="translate(18 44) rotate(-12)" fill="#e8e1d5">
      <rect x="-6" y="-2" width="12" height="11" rx="3"/>
      <rect x="-6" y="-10" width="2.8" height="9" rx="1.4"/>
      <rect x="-2.4" y="-12" width="2.8" height="11" rx="1.4"/>
      <rect x="1.2" y="-11" width="2.8" height="10" rx="1.4"/>
      <rect x="4.6" y="-8" width="2.6" height="8" rx="1.3"/>
      <rect x="-10" y="0" width="6" height="2.6" rx="1.3" transform="rotate(-30)"/>
    </g>
  </g>
</svg>
