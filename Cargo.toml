[workspace]
resolver = "2"
members = ["crates/hearth-core", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Smaller, faster release builds of the desktop app.
[profile.release]
lto = true
codegen-units = 1
strip = true
